<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نظام إدارة التوصيل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#4f46e5;--p2:#7c3aed;--b:#0ea5e9;--bg:#f1f5f9;--c:#fff;--c2:#f8fafc;--t:#0f172a;--m:#64748b;--ln:#e2e8f0;--ok:#10b981;--no:#ef4444;--wn:#f59e0b;--sh:0 1px 2px #0f172a0d,0 8px 24px #0f172a10;--r:16px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1020;--c:#121a2e;--c2:#0f1729;--t:#e5e9f5;--m:#94a3b8;--ln:#22304a;--sh:0 1px 2px #0006,0 8px 24px #0004}}
:root[data-theme=dark]{--bg:#0b1020;--c:#121a2e;--c2:#0f1729;--t:#e5e9f5;--m:#94a3b8;--ln:#22304a;--sh:0 1px 2px #0006,0 8px 24px #0004}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--t);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:15px}[hidden]{display:none!important}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h3{margin:0 0 14px;font-size:18px}h6{margin:0;font-size:12px;color:var(--m);font-weight:700;padding:10px 4px 4px}
/* ===== login ===== */
.lw{min-height:100vh;display:grid;grid-template-columns:minmax(340px,520px) 1fr}
.lf{display:flex;align-items:center;justify-content:center;padding:28px;background:var(--c)}.lbox{width:100%;max-width:400px;animation:up .5s both}
.lbrand{display:flex;align-items:center;gap:12px;margin-bottom:26px}.lmark{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--p),var(--b));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px #4f46e555}.lmark .ic{width:28px;height:28px}
.lbrand b{font-size:20px;display:block}.lbrand span{color:var(--m);font-size:13px}
.lbox h2{margin:0 0 4px;font-size:26px}.lbox p.sub{margin:0 0 22px;color:var(--m)}
.lh{position:relative;overflow:hidden;color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:center;gap:22px;background:linear-gradient(135deg,#1e1b4b,#4338ca 55%,#0ea5e9)}
.lh:before,.lh:after{content:'';position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:fl 9s ease-in-out infinite alternate}
.lh:before{width:380px;height:380px;background:#7c3aed;top:-110px;left:-90px}.lh:after{width:320px;height:320px;background:#22d3ee;bottom:-90px;right:-60px;animation-delay:-4s}
.lh>*{position:relative;z-index:1}.lh h1{margin:0;font-size:38px;line-height:1.3}.lh p{margin:0;opacity:.85;font-size:17px;max-width:480px}
.lfeat{display:grid;gap:12px;margin-top:6px}.lfeat div{display:flex;gap:12px;align-items:center;background:#ffffff1a;backdrop-filter:blur(8px);border:1px solid #ffffff26;border-radius:14px;padding:12px 16px}
.fld{margin-bottom:14px}.fld label{display:block;font-weight:600;font-size:13px;margin:0 0 6px;color:var(--m)}
.inp{position:relative}.inp>.ic{position:absolute;top:50%;transform:translateY(-50%);right:13px;color:var(--m);width:18px;height:18px}
.inp input{padding-right:42px}.inp .eye{position:absolute;left:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--m);cursor:pointer;padding:6px;display:flex}
input,select,textarea{width:100%;padding:11px 14px;border:1.5px solid var(--ln);border-radius:12px;background:var(--c);color:var(--t);transition:.15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 4px #4f46e51f}
input[type=checkbox]{width:auto;accent-color:var(--p);transform:scale(1.15)}
.lerr{background:#ef444418;color:var(--no);border:1px solid #ef444440;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-weight:600;font-size:14px}
.lmeta{display:flex;justify-content:space-between;align-items:center;margin:4px 0 18px;font-size:14px}.lmeta label{display:flex;gap:8px;align-items:center;cursor:pointer;margin:0;color:var(--t)}
.demo{margin-top:22px;border:1.5px dashed var(--ln);border-radius:14px;padding:12px 14px;background:var(--c2)}.demo b{font-size:13px;color:var(--m)}
.demo div{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.demo button{border:1px solid var(--ln);background:var(--c);color:var(--t);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer}.demo button:hover{border-color:var(--p);color:var(--p)}
@media(max-width:900px){.lw{grid-template-columns:1fr}.lh{display:none}}
/* ===== buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:12px;padding:10px 18px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--p),var(--p2));cursor:pointer;box-shadow:0 4px 14px #4f46e540;transition:.15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);filter:brightness(1.07)}.btn:active{transform:none}.btn.block{width:100%;padding:13px}
.btn.ghost{background:var(--c);color:var(--t);border:1.5px solid var(--ln);box-shadow:none}.btn.ghost:hover{border-color:var(--p);color:var(--p)}
.btn.ok{background:linear-gradient(135deg,#059669,#10b981);box-shadow:0 4px 14px #10b98140}.btn.danger{background:linear-gradient(135deg,#dc2626,#ef4444);box-shadow:0 4px 14px #ef444440}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}.btn[disabled]{opacity:.4;pointer-events:none}
.ib{width:34px;height:34px;border-radius:10px;border:1px solid var(--ln);background:var(--c);color:var(--t);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;margin:0 2px;transition:.15s}.ib:hover{border-color:var(--p);color:var(--p);background:#4f46e50f}.ib.red:hover{border-color:var(--no);color:var(--no);background:#ef44440f}.ib .ic{width:17px;height:17px}
/* ===== shell ===== */
#nav{position:fixed;top:0;bottom:0;right:0;width:272px;z-index:30;display:flex;flex-direction:column;background:linear-gradient(185deg,#1e1b4b,#312e81 55%,#0c4a6e);color:#fff;transform:translateX(100%);transition:transform .25s}
#nav.open{transform:none}.nb{display:flex;align-items:center;gap:12px;padding:18px 18px 12px}.nb .lmark{width:44px;height:44px;border-radius:14px;background:#ffffff26;box-shadow:none}.nb b{font-size:16px;display:block;line-height:1.2}.nb span{font-size:12px;opacity:.7}
.ns{flex:1;overflow:auto;padding:4px 12px 12px}.ns::-webkit-scrollbar{width:5px}.ns::-webkit-scrollbar-thumb{background:#ffffff33;border-radius:5px}
.ns h6{color:#ffffff88;padding:14px 10px 6px;letter-spacing:.5px}
.ns a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;font-size:14.5px;cursor:pointer;color:#ffffffd9;margin:1px 0;transition:.15s}.ns a:hover{background:#ffffff17}
.ns a.on{background:#fff;color:var(--p);font-weight:700;box-shadow:0 6px 16px #0003}.ns a em{margin-inline-start:auto;background:var(--no);color:#fff;border-radius:10px;padding:0 8px;font-style:normal;font-size:12px;font-weight:700}
.nu{padding:12px;border-top:1px solid #ffffff22;display:flex;align-items:center;gap:10px}.nu .av{background:#ffffff2a}.nu div{flex:1;min-width:0}.nu b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nu span{font-size:12px;opacity:.7}
.nu button{background:#ffffff1f;color:#fff;border:0;border-radius:10px;width:38px;height:38px;cursor:pointer;display:flex;align-items:center;justify-content:center}.nu button:hover{background:var(--no)}
.sh{position:fixed;inset:0;background:#0f172a99;backdrop-filter:blur(2px);z-index:25;display:none}.sh.open{display:block}
.av{display:inline-flex;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--b));color:#fff;align-items:center;justify-content:center;font-weight:800;flex:none;font-size:14px}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 20px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
#top h1{margin:0;font-size:19px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbn{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--ln);background:var(--c);color:var(--t);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}.tbn:hover{border-color:var(--p);color:var(--p)}
.tbn i{position:absolute;top:-5px;left:-5px;background:var(--no);color:#fff;border-radius:10px;font-style:normal;font-size:11px;font-weight:700;padding:0 6px;min-width:18px;text-align:center}
.tsearch{display:flex;align-items:center;gap:8px;background:var(--c);border:1px solid var(--ln);border-radius:12px;padding:0 12px;height:40px;color:var(--m);cursor:pointer;min-width:220px}.tsearch kbd{margin-inline-start:auto;font:600 11px Cairo;border:1px solid var(--ln);border-radius:6px;padding:1px 6px}
.uch{display:flex;align-items:center;gap:8px;cursor:pointer;padding:3px 4px 3px 10px;border:1px solid var(--ln);border-radius:30px;background:var(--c)}.uch b{font-size:13px;display:block;line-height:1.1}.uch span{font-size:11px;color:var(--m)}
.pop{position:absolute;top:56px;left:20px;z-index:40;background:var(--c);border:1px solid var(--ln);border-radius:16px;box-shadow:0 20px 50px #0f172a40;min-width:260px;max-width:92vw;overflow:hidden;animation:up .2s both}
.pop a{display:flex;gap:10px;align-items:center;padding:11px 16px;cursor:pointer;font-size:14px}.pop a:hover{background:var(--c2)}.pop hr{border:0;border-top:1px solid var(--ln);margin:0}.pop .hd{padding:12px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.pop .nf{display:flex;gap:10px;padding:10px 16px;border-top:1px solid var(--ln);font-size:13px}.pop .nf.rd{opacity:.55}
main{max-width:1180px;margin:0 auto;padding:20px;animation:up .35s both}
@media(min-width:1000px){body.in{padding-right:272px}body.in #nav{transform:none}#mb{display:none}.sh{display:none!important}}
@media(max-width:700px){.tsearch{min-width:0}.tsearch span,.tsearch kbd,.uch div{display:none}main{padding:14px}#top{padding:10px 12px}}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes fl{to{transform:translate(40px,30px) scale(1.1)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== cards ===== */
.card{background:var(--c);border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:18px;overflow:hidden}
.ch{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--ln);font-weight:800;font-size:16px}.ch .ci{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#4f46e51f,#0ea5e91f);color:var(--p);display:flex;align-items:center;justify-content:center}.ch .ac{margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap}
.cb{padding:18px}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}.g3>.card{margin:0}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.fg label{display:block;font-weight:600;font-size:13px;margin:0 0 5px;color:var(--m)}
.hero{position:relative;overflow:hidden;color:#fff;border-radius:22px;padding:24px;margin-bottom:18px;background:linear-gradient(120deg,#4338ca,#7c3aed 55%,#0ea5e9);box-shadow:0 14px 34px #4f46e53a}
.hero:after{content:'';position:absolute;width:260px;height:260px;border-radius:50%;background:#ffffff1c;top:-90px;left:-60px}.hero>*{position:relative;z-index:1}.hero h2{margin:0 0 4px;font-size:24px}.hero p{margin:0 0 14px;opacity:.9}.hero .qa{display:flex;gap:8px;flex-wrap:wrap}.hero .btn{background:#ffffff26;box-shadow:none;border:1px solid #ffffff44;backdrop-filter:blur(6px)}.hero .btn:hover{background:#ffffff40}
.kp{position:relative;display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);background:var(--c);border:1px solid var(--ln);box-shadow:var(--sh);cursor:pointer;transition:.2s;overflow:hidden}.kp:hover{transform:translateY(-3px);box-shadow:0 14px 30px #0f172a1f}
.kp .ki{width:50px;height:50px;border-radius:14px;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}.kp .ki .ic{width:24px;height:24px}.kp span{font-size:13px;color:var(--m);font-weight:600}.kp b{display:block;font-size:24px;line-height:1.2}.kp svg.sp{position:absolute;left:10px;bottom:8px;width:84px;height:30px;opacity:.9}
.k{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--ln)}.k:last-child{border:0}.k b{font-size:17px}.pos{color:var(--ok)}.neg{color:var(--no)}
.bar{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}.bar span{width:105px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar .bt{flex:1;height:10px;border-radius:6px;background:var(--bg);overflow:hidden}.bar .bt i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--b),var(--p));transition:width .6s}.bar b{width:46px;text-align:left}
.chart{width:100%;height:auto;direction:ltr}.chart .gl{stroke:var(--ln);stroke-dasharray:3 4}.chart .tv{fill:var(--t);font:700 11px Cairo}.chart .tl2{fill:var(--m);font:11px Cairo}
.dn{display:flex;gap:22px;align-items:center;flex-wrap:wrap;justify-content:center}.dn .rg{width:150px;height:150px;border-radius:50%;position:relative}.dn .rg div{position:absolute;inset:26px;background:var(--c);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:24px;line-height:1.1}.dn .rg small{font-size:11px;color:var(--m);font-weight:600}
.lg2 div{margin:6px 0;font-size:13.5px;display:flex;align-items:center;gap:8px}.lg2 i{width:12px;height:12px;border-radius:4px;display:inline-block}
.ins{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;margin-bottom:10px;cursor:pointer;border:1px solid var(--ln);background:var(--c2);transition:.15s}.ins:hover{border-color:var(--p);transform:translateX(-3px)}.ins .ii{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.ins.no .ii{background:var(--no)}.ins.wn .ii{background:var(--wn)}.ins.b .ii{background:var(--b)}.ins.ok .ii{background:var(--ok)}.ins span{flex:1;font-size:14px;font-weight:600}
/* ===== tables ===== */
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}.sb{display:flex;align-items:center;gap:8px;background:var(--c2);border:1.5px solid var(--ln);border-radius:12px;padding:0 12px;flex:1;min-width:170px}.sb:focus-within{border-color:var(--p)}.sb input{border:0;background:none;box-shadow:none!important;padding:10px 0}.sb .ic{color:var(--m);width:18px;height:18px}
select.mini{width:auto;padding:9px 12px}
.tw{overflow:auto;border:1px solid var(--ln);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:680px}
th{background:var(--c2);font-size:12.5px;color:var(--m);padding:11px 12px;text-align:right;white-space:nowrap;position:sticky;top:0;user-select:none}th.sr{cursor:pointer}th.sr:hover{color:var(--p)}
td{padding:10px 12px;border-top:1px solid var(--ln);font-size:14px}tbody tr:hover td{background:var(--c2)}td select{padding:5px 8px;font-size:13px;width:auto;border-radius:9px}
tr.late td{background:#ef444414}tr.del td{background:#f59e0b1a}tr.red td{background:#ef44441f}
.bd{display:inline-block;padding:3px 11px;border-radius:20px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.pg{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-size:13px;color:var(--m);margin-top:12px}
.chips{display:flex;gap:6px;overflow:auto;margin:0 0 12px;padding-bottom:2px}.chips button{border:1.5px solid var(--ln);background:var(--c);color:var(--t);border-radius:20px;padding:6px 14px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;transition:.15s}.chips button:hover{border-color:var(--p)}.chips .on{background:var(--p);color:#fff;border-color:var(--p)}
.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{flex:1;border:1.5px solid var(--ln);background:var(--c);color:var(--t);padding:11px;border-radius:12px;font-weight:700;cursor:pointer}.tabs .on{background:var(--p);color:#fff;border-color:var(--p)}.tabs span{background:#fff;color:var(--p);border-radius:12px;padding:0 8px;margin-inline-start:6px;font-size:12px}
.od{border:1.5px solid var(--ln);border-radius:16px;padding:14px;margin-top:12px;background:var(--c2)}.em{text-align:center;color:var(--m);padding:24px}.okb{border:2px dashed var(--ok);border-radius:14px;padding:14px;margin-top:16px;min-height:50px}
.hint{color:var(--m);font-size:13px;margin:8px 0}.pwr{display:flex;gap:6px}.pm{height:6px;border-radius:4px;background:var(--ln);margin-top:6px;overflow:hidden}.pm i{display:block;height:100%;transition:.3s}
.mp{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 14px}.mp label{display:flex;gap:8px;align-items:center;font-size:14px;margin:0;color:var(--t);cursor:pointer;padding:4px 0;font-weight:500}
.tl{display:flex;margin:16px 0}.tl div{flex:1;text-align:center;font-size:11px;color:var(--m);position:relative}.tl i{display:block;width:16px;height:16px;border-radius:50%;background:var(--ln);margin:0 auto 5px}.tl .on{color:var(--t);font-weight:700}.tl .on i{background:var(--ok);box-shadow:0 0 0 4px #10b98133}
.nfr{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--ln)}.nfr>span{flex:1}.nfr .ic{width:36px;height:36px;padding:8px;border-radius:50%;background:var(--bg)}
/* ===== modal / toast ===== */
.mb{position:fixed;inset:0;background:#0f172a99;backdrop-filter:blur(3px);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px 14px;overflow:auto}
.mc{position:relative;background:var(--c);border-radius:20px;padding:22px;max-width:540px;width:100%;box-shadow:0 30px 70px #0f172a55;animation:up .25s both}.mc.wide{max-width:760px}.mc .x{position:absolute;top:14px;left:14px;width:32px;height:32px;border:0;border-radius:10px;background:var(--bg);color:var(--t);cursor:pointer;display:flex;align-items:center;justify-content:center}
.mf{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}.pal .sb.big{padding:4px 14px}.pal h6{padding:12px 4px 4px}.pi2{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;cursor:pointer}.pi2:hover{background:var(--c2)}.pi2 em{margin-inline-start:auto;font-style:normal;font-size:12px;color:var(--m)}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:#0f172a;color:#fff;padding:11px 22px;border-radius:30px;opacity:0;transition:.3s;z-index:90;pointer-events:none;font-weight:600;box-shadow:0 10px 30px #0006}#toast.on{opacity:1;transform:translate(-50%,0)}
.rcw{zoom:1.35;display:flex;flex-direction:column;align-items:center;gap:12px}.rcp{width:58mm;background:#fff;color:#000;padding:3mm;font:12px/1.5 Cairo,Tahoma,sans-serif;border:1px dashed #999;direction:rtl}
.rcp .c{text-align:center}.rcp .h{font-size:16px;font-weight:700}.rcp .rl{display:flex;justify-content:space-between;gap:6px;margin:2px 0}.rcp hr{border:0;border-top:1px dashed #000;margin:5px 0}.rcp .tot{text-align:center;font-size:17px;font-weight:700}.rcp svg{display:block;margin:4px auto;width:100%;height:44px}
body.pr>*:not(#md){display:none!important}body.pr .mb{position:static;background:none;display:block;padding:0}body.pr .mc{max-height:none;overflow:visible;padding:0;box-shadow:none;background:none;max-width:none;animation:none}body.pr .mc .x,body.pr .noprint{display:none!important}body.pr .rcw{zoom:1;gap:0}body.pr .rcp{border:0;margin:0;page-break-after:always}
footer{text-align:center;color:var(--m);padding:6px 0 28px;font-size:12px}
@media print{#top,#nav,.sh,.btn,.tb,.pg,.ib,footer{display:none!important}body.in{padding:0}}
</style>
</head>
<body>
<div id="lg"></div>
<div id="app" hidden>
<nav id="nav"></nav><div class="sh" id="sh" onclick="nv(0)"></div>
<div id="top"></div>
<main id="m"></main>
<footer id="ft"></footer>
</div>
<div id="md"></div><div id="toast"></div>
<script>
'use strict';
/* ================= أدوات عامة ================= */

function parseCSV(t){const r=[];let row=[],c='',q=0;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=ch}else if(ch=='"')q=1;else if(ch==','){row.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;row.push(c);c='';if(row.some(x=>x!==''))r.push(row);row=[]}else c+=ch}row.push(c);if(row.some(x=>x!==''))r.push(row);return r}

V.usr=()=>{const L=users.map((u,i)=>[u,i]).filter(x=>(S.uoff?!x[0].on:x[0].on)&&(!S.ur||x[0].role==S.ur));
return card('إدارة المستخدمين والصلاحيات',`<div class="mf" style="margin:0 0 12px"><button class="btn" onclick="addUserM()">${ic('plus')} إضافة مستخدم</button><button class="btn ghost" onclick="S.uoff=!S.uoff;draw()">${S.uoff?'عرض المفعّلين':'عرض المعطّلين'}</button></div><div class="chips"><button class="${!S.ur?'on':''}" onclick="S.ur='';draw()">الكل</button>${RL.map(r=>`<button class="${S.ur==r?'on':''}" onclick="S.ur='${r}';draw()">${r} ${users.filter(u=>u.role==r).length}</button>`).join('')}</div>`+dt('us',['#','الاسم','اسم المستخدم','الصلاحية','الهاتف','آخر دخول','إجراءات'],L.map(([u],k)=>({t:[k+1,`<span class="av" style="width:28px;height:28px;margin-inline-end:8px;font-size:12px">${esc(u.name[0])}</span>${esc(u.name)}`,esc(u.un),rb(u.role),esc(u.ph),u.last||'—',`<button class="ib" title="الصلاحيات" onclick="permM(${u.id})">${ic('shield')}</button><button class="ib" title="كلمة المرور" onclick="pwM(${u.id})">${ic('key')}</button><button class="btn sm ${u.on?'danger':'ok'}" onclick="tgU(${u.id})">${u.on?'تعطيل':'تفعيل'}</button><button class="ib red" title="حذف" onclick="delU(${u.id})">${ic('trash')}</button>`]}))))};
function pwm(v,id){let s=0;if(v.length>=6)s++;if(v.length>=9)s++;if(/[A-Z]/.test(v)&&/[a-z]/.test(v))s++;if(/\d/.test(v))s++;if(/[^A-Za-z0-9]/.test(v))s++;const e=$('#'+id);if(e)e.innerHTML=`<i style="width:${s*20}%;background:${s<2?'#ef4444':s<4?'#f59e0b':'#10b981'}"></i>`}
function addUserM(){if(!need('usr'))return;modal(`<h3>إضافة مستخدم</h3><div class="fg">${fl('الاسم الكامل','<input id="u1">')}${fl('اسم المستخدم (للدخول)','<input id="u2" dir="ltr" autocomplete="off">')}${fl('كلمة المرور',`<div class="pwr"><input id="u5" dir="ltr" oninput="pwm(this.value,'u5m')" autocomplete="off"><button class="btn ghost sm" type="button" onclick="$('#u5').value=genPw();pwm($('#u5').value,'u5m')">توليد</button></div><div class="pm" id="u5m"></div>`)}${fl('رقم الهاتف','<input id="u3" dir="ltr">')}${fl('الصلاحية (الدور)',`<select id="u4">${RL.map(r=>`<option>${r}</option>`).join('')}</select>`)}</div><p class="hint">للعميل والمندوب: يجب أن يطابق الاسم اسم العميل/المندوب ليرى طلباته فقط. يمكنك تخصيص الصلاحيات بعد الحفظ.</p><div class="mf"><button class="btn" onclick="saveUser()">حفظ</button></div>`)}
function saveUser(){const name=$('#u1').value.trim(),un=$('#u2').value.trim(),pw=$('#u5').value,role=$('#u4').value;if(!name||!un||!pw)return toast('أكمل الاسم واسم المستخدم وكلمة المرور');if(!/^[A-Za-z0-9_.-]{3,}$/.test(un))return toast('اسم المستخدم: أحرف إنجليزية وأرقام (3 فأكثر)');if(pw.length<4)return toast('كلمة المرور 4 أحرف على الأقل');if(users.some(u=>u.un.toLowerCase()==un.toLowerCase()))return toast('اسم المستخدم مستخدم مسبقًا');
users.push({id:Math.max(0,...users.map(u=>u.id))+1,name,un,pw:hp(un,pw),role,ph:$('#u3').value,on:1,perms:[...RP[role]],last:''});if(role=='عميل'&&!clients.includes(name))clients.push(name);if(role=='مندوب'&&!drivers.includes(name))drivers.push(name);addLog('إضافة مستخدم',un+' ('+role+')');closeM();toast('تمت الإضافة');draw()}
function permM(id){if(!need('usr'))return;const u=users.find(x=>x.id==id),grp=[...new Set(M.map(x=>x[3]))];
modal(`<h3>صلاحيات: ${esc(u.name)}</h3>${u.role=='مدير'?'<p class="hint">المدير يملك كل الصلاحيات تلقائيًا. غيّر الدور لتخصيص صلاحيات محددة.</p>':''}<div class="fg">${fl('الدور',`<select id="pr" onchange="rolePerm(this.value)">${RL.map(r=>`<option ${r==u.role?'selected':''}>${r}</option>`).join('')}</select>`)}</div>${grp.map(g=>`<h6>${g}</h6><div class="mp">${M.filter(x=>x[3]==g).map(x=>`<label><input type="checkbox" class="pk" value="${x[0]}" ${u.role=='مدير'||u.perms.includes(x[0])?'checked':''}> ${x[2]}</label>`).join('')}</div>`).join('')}<h6>الإجراءات المسموحة</h6><div class="mp">${ACT.map(x=>`<label><input type="checkbox" class="pk" value="${x[0]}" ${u.role=='مدير'||u.perms.includes(x[0])?'checked':''}> ${x[1]}</label>`).join('')}</div><div class="mf"><button class="btn" onclick="savePerm(${id})">حفظ الصلاحيات</button><button class="btn ghost" onclick="$$('.pk').forEach(c=>c.checked=true)">تحديد الكل</button><button class="btn ghost" onclick="$$('.pk').forEach(c=>c.checked=false)">إلغاء الكل</button></div>`,1)}
const rolePerm=r=>$$('.pk').forEach(c=>c.checked=RP[r].includes(c.value));
function savePerm(id){const u=users.find(x=>x.id==id),r=$('#pr').value;if(u.role=='مدير'&&r!='مدير'&&users.filter(x=>x.role=='مدير'&&x.on).length<2)return toast('لا يمكن إزالة آخر مدير');
u.role=r;u.perms=$$('.pk:checked').map(c=>c.value);addLog('تعديل صلاحيات',u.un);if(cu&&cu.id==id)drawNav();closeM();toast('تم حفظ الصلاحيات');draw()}
function pwM(id){if(!need('usr'))return;const u=users.find(x=>x.id==id);modal(`<h3>كلمة مرور: ${esc(u.name)}</h3>${fl('كلمة المرور الجديدة',`<div class="pwr"><input id="np" dir="ltr" oninput="pwm(this.value,'npm')" autocomplete="off"><button class="btn ghost sm" type="button" onclick="$('#np').value=genPw();pwm($('#np').value,'npm')">توليد</button></div><div class="pm" id="npm"></div>`)}<div class="mf"><button class="btn" onclick="savePw(${id})">حفظ</button></div>`)}
function savePw(id){const u=users.find(x=>x.id==id),p=$('#np').value;if(p.length<4)return toast('كلمة المرور 4 أحرف على الأقل');u.pw=hp(u.un,p);addLog('تغيير كلمة مرور',u.un);closeM();toast('تم تغيير كلمة المرور')}
function tgU(id){if(!need('usr'))return;const u=users.find(x=>x.id==id);if(u.id==cu.id)return toast('لا يمكنك تعطيل حسابك');if(u.on&&u.role=='مدير'&&users.filter(x=>x.role=='مدير'&&x.on).length<2)return toast('لا يمكن تعطيل آخر مدير');u.on=u.on?0:1;addLog(u.on?'تفعيل مستخدم':'تعطيل مستخدم',u.un);draw()}
function delU(id){if(!need('usr'))return;const u=users.find(x=>x.id==id);if(u.id==cu.id)return toast('لا يمكنك حذف حسابك');if(u.role=='مدير'&&users.filter(x=>x.role=='مدير').length<2)return toast('لا يمكن حذف آخر مدير');cfm('حذف المستخدم «'+u.name+'» نهائيًا؟',()=>{users=users.filter(x=>x.id!=id);addLog('حذف مستخدم',u.un);toast('تم الحذف');draw()},'حذف',1)}
V.prof=()=>card('ملفي الشخصي',`<div style="display:flex;gap:16px;align-items:center;margin-bottom:14px"><span class="av" style="width:64px;height:64px;font-size:26px">${esc(cu.name[0])}</span><div><b style="font-size:20px">${esc(cu.name)}</b><br>${rb(cu.role)} <span class="hint">@${esc(cu.un)}</span></div></div><div class="k"><span>الهاتف</span><b style="font-size:15px">${esc(cu.ph)||'—'}</b></div><div class="k"><span>آخر دخول</span><b style="font-size:15px">${cu.last||'—'}</b></div><div class="k"><span>الصفحات المتاحة</span><b style="font-size:15px">${M.filter(p=>can(p[0])).length} من ${M.length}</b></div>`,{ic:'user'})+card('تغيير كلمة المرور',`<div class="fg">${fl('كلمة المرور الحالية','<input id="o1" type="password" dir="ltr" autocomplete="current-password">')}${fl('الجديدة',`<input id="o2" type="password" dir="ltr" oninput="pwm(this.value,'o2m')" autocomplete="new-password"><div class="pm" id="o2m"></div>`)}${fl('تأكيد الجديدة','<input id="o3" type="password" dir="ltr" autocomplete="new-password">')}</div><div class="mf"><button class="btn" onclick="chPw()">${ic('key')} تغيير</button></div>`,{ic:'key'});
function chPw(){const a=$('#o1').value,b=$('#o2').value,c=$('#o3').value;if(cu.pw!=hp(cu.un,a))return toast('كلمة المرور الحالية غير صحيحة');if(b.length<4)return toast('الجديدة 4 أحرف على الأقل');if(b!=c)return toast('التأكيد غير مطابق');cu.pw=hp(cu.un,b);addLog('تغيير كلمة مرور','ذاتي');toast('تم تغيير كلمة المرور');draw()}
/* ---- سجل النشاط / اعدادات / نسخ احتياطي ---- */
V.log=()=>card('سجل النشاط',dt('lg',['الوقت','المستخدم','الدور','العملية','التفاصيل'],logs.map(l=>({t:[l.t,esc(l.u),l.r?rb(l.r):'—',esc(l.a),esc(l.d)]}))),{ac:cu.role=='مدير'?`<button class="btn danger sm" onclick="cfm('مسح السجل بالكامل؟',()=>{logs=[];addLog('مسح السجل');draw()},'مسح',1)">مسح السجل</button>`:''});
V.set=()=>card('إعدادات الشركة',`<div class="fg">${fl('اسم الشركة',`<input id="c1" value="${esc(cfg.name)}">`)}${fl('هاتف الشركة',`<input id="c2" value="${esc(cfg.ph)}" dir="ltr">`)}${fl('العنوان',`<input id="c3" value="${esc(cfg.addr)}">`)}${fl('أجرة المندوب الافتراضية (د.ع)',`<input id="c4" type="number" value="${cfg.fd}">`)}${fl('أجرة العميل الافتراضية (د.ع)',`<input id="c5" type="number" value="${cfg.fc}">`)}${fl('تسجيل خروج تلقائي بعد (دقيقة، 0 = معطّل)',`<input id="c6" type="number" value="${cfg.idle}">`)}${fl('إظهار الحسابات التجريبية في شاشة الدخول',`<select id="c7"><option value="1" ${cfg.demo?'selected':''}>نعم</option><option value="0" ${cfg.demo?'':'selected'}>لا (موصى به عند الاستخدام الفعلي)</option></select>`)}</div><div class="mf"><button class="btn" onclick="saveCfg()">حفظ الإعدادات</button><button class="btn danger" onclick="cfm('سيتم حذف كل البيانات وإعادة البيانات التجريبية. متابعة؟',()=>{UNPACK(seedData());persist();logout()},'إعادة ضبط',1)">إعادة ضبط البيانات التجريبية</button></div>`);
function saveCfg(){cfg.name=$('#c1').value||CFG0.name;cfg.ph=$('#c2').value;cfg.addr=$('#c3').value;cfg.fd=+$('#c4').value||0;cfg.fc=+$('#c5').value||0;cfg.idle=+$('#c6').value||0;cfg.demo=+$('#c7').value;addLog('تعديل الإعدادات');bump();drawNav();toast('تم حفظ الإعدادات')}
V.bak=()=>card('النسخ الاحتياطي والاستعادة',`<p class="hint">يحفظ كل بيانات النظام (الطلبات، المستخدمون، الحسابات، الإعدادات) في ملف JSON. احتفظ به في مكان آمن لأنه يحتوي على بيانات حسّاسة.</p><div class="mf"><button class="btn" onclick="bkE()">${ic('download')} تنزيل نسخة احتياطية</button></div><hr style="border:0;border-top:1px solid var(--ln);margin:18px 0"><div class="fg">${fl('استعادة من ملف','<input type="file" id="bk" accept=".json">')}</div><div class="mf"><button class="btn danger" onclick="bkI()">${ic('upload')} استعادة</button></div>`);
function bkE(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(PACK())],{type:'application/json'}));a.download='backup-'+TD+'.json';a.click();addLog('نسخة احتياطية');toast('تم التنزيل')}
function bkI(){const fi=$('#bk').files[0];if(!fi)return toast('اختر ملف النسخة');fi.text().then(t=>{let d;try{d=JSON.parse(t)}catch(e){return toast('الملف غير صالح')}if(!Array.isArray(d.users)||!Array.isArray(d.O)||!d.users.some(u=>u.role=='مدير'))return toast('بنية الملف غير صحيحة');cfm('سيتم استبدال كل البيانات الحالية بالنسخة. متابعة؟',()=>{const un=cu.un;UNPACK(d);const u=users.find(x=>x.un==un);addLog('استعادة نسخة احتياطية');persist();if(u){cu=u;go('home');toast('تمت الاستعادة')}else logout()},'استعادة',1)})}
/* ================= الوصولات ================= */
function bars(no){const l=[];let x=0;String(no).split('').forEach(ch=>{const d=+ch,w=[1+d%3,1,1+((d>>1)%2)+1,1];w.forEach((v,i)=>{if(i%2==0)l.push([x,v]);x+=v});x+=1});return{l,w:x}}
function rcHTML(o){const b=bars(o.no);return `<div class="rcp"><div class="c h">${esc(cfg.name)}</div><div class="c">وصل تسليم</div><svg viewBox="0 0 ${b.w} 10" preserveAspectRatio="none">${b.l.map(([x,w])=>`<rect x="${x}" y="0" width="${w}" height="10" fill="#000"/>`).join('')}</svg><div class="c h">${o.no}</div><hr>${[['التاريخ',o.dt],['العميل',o.cl],['الزبون',o.cu],['الهاتف',o.ph],['العنوان',o.pv+' - '+o.ar],['البضاعة',o.gd+' ('+o.qt+')'],['المندوب',o.dr]].map(x=>`<div class="rl"><span>${x[0]}</span><b>${esc(x[1])}</b></div>`).join('')}<hr><div class="c">المبلغ المطلوب</div><div class="tot">${f(o.am)} د.ع</div><hr><div class="c">${esc(cfg.ph)}</div><div class="c">شكرًا لتعاملكم معنا</div></div>`}
function rcM(ns,auto){S.rn=ns;const L=ns.map(n=>O.find(o=>o.no==n)).filter(Boolean);if(!L.length)return;if(auto&&!can('a:exp'))auto=false;modal(`<h3 class="noprint" style="text-align:center">معاينة الوصل · 58mm</h3><div class="rcw">${L.map(rcHTML).join('')}</div><div class="noprint mf" style="justify-content:center">${can('a:exp')?`<button class="btn" onclick="prt()">${ic('print')} طباعة</button><button class="btn ok" onclick="dlRc('png')">PNG</button><button class="btn ok" onclick="dlRc('pdf')">PDF</button>`:''}</div>`);if(auto)setTimeout(prt,200)}
function prt(){const st=document.createElement('style');st.textContent='@page{size:58mm auto;margin:0}';document.head.appendChild(st);document.body.classList.add('pr');print();document.body.classList.remove('pr');st.remove()}
function rcCanvas(os){const W=464,H=700,c=document.createElement('canvas');c.width=W;c.height=H*os.length;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,c.height);x.fillStyle='#000';x.strokeStyle='#000';x.direction='rtl';
os.forEach((o,k)=>{let y=k*H+44;const R=W-24,L=24,fn=(sz,b)=>x.font=`${b?'700 ':''}${sz}px Cairo,Tahoma,sans-serif`;
const C=(t,sz,b)=>{fn(sz,b);x.textAlign='center';x.fillText(t,W/2,y)},ln=()=>{x.setLineDash([6,4]);x.beginPath();x.moveTo(L,y);x.lineTo(R,y);x.stroke();y+=26};
C(cfg.name,30,1);y+=34;C('وصل تسليم',20);y+=22;const b=bars(o.no),sc=(W-48)/b.w;b.l.forEach(([bx,bw])=>x.fillRect(L+bx*sc,y,bw*sc,70));y+=102;C(String(o.no),32,1);y+=16;ln();
[['التاريخ',o.dt],['العميل',o.cl],['الزبون',o.cu],['الهاتف',o.ph],['العنوان',o.pv+' - '+o.ar],['البضاعة',o.gd+' ('+o.qt+')'],['المندوب',o.dr]].forEach(([a,v])=>{fn(20);x.textAlign='right';x.fillText(a,R,y);const lw=x.measureText(a).width;fn(20,1);x.textAlign='left';x.fillText(String(v),L,y,W-48-lw-12);y+=36});
y-=6;ln();C('المبلغ المطلوب',20);y+=40;C(f(o.am)+' د.ع',34,1);y+=22;ln();C('شكرًا لتعاملكم معنا',20)});return c}
function pdfFrom(b64,w,h,pw,ph){const jb=Uint8Array.from(atob(b64),c=>c.charCodeAt(0)),enc=new TextEncoder(),parts=[],xr=[];let off=0;const add=b=>{if(typeof b=='string')b=enc.encode(b);parts.push(b);off+=b.length},obj=(n,body)=>{xr[n]=off;add(n+' 0 obj\n'+body+'\nendobj\n')};
add('%PDF-1.4\n');obj(1,'<</Type/Catalog/Pages 2 0 R>>');obj(2,'<</Type/Pages/Kids[3 0 R]/Count 1>>');obj(3,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${pw} ${ph}]/Resources<</XObject<</Im 4 0 R>>>>/Contents 5 0 R>>`);
xr[4]=off;add(`4 0 obj\n<</Type/XObject/Subtype/Image/Width ${w}/Height ${h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jb.length}>>\nstream\n`);add(jb);add('\nendstream\nendobj\n');
const cs=`q ${pw} 0 0 ${ph} 0 0 cm /Im Do Q`;obj(5,`<</Length ${cs.length}>>\nstream\n${cs}\nendstream`);const xo=off;
add('xref\n0 6\n0000000000 65535 f \n'+[1,2,3,4,5].map(n=>String(xr[n]).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n${xo}\n%%EOF`);return new Blob(parts,{type:'application/pdf'})}
async function dlRc(fmt){if(!need('a:exp'))return;const os=S.rn.map(n=>O.find(o=>o.no==n)).filter(Boolean);if(document.fonts&&document.fonts.ready)await document.fonts.ready;const c=rcCanvas(os),nm='receipt-'+(os.length>1?os[0].no+'-'+os[os.length-1].no:os[0].no),a=document.createElement('a');
if(fmt=='png'){a.href=c.toDataURL('image/png');a.download=nm+'.png'}else{const pw=164.4;a.href=URL.createObjectURL(pdfFrom(c.toDataURL('image/jpeg',.95).split(',')[1],c.width,c.height,pw,+(pw*c.height/c.width).toFixed(1)));a.download=nm+'.pdf'}
document.body.appendChild(a);a.click();a.remove();toast('تم التحميل')}
/* ================= الإقلاع ================= */
(function boot(){const id=SS.get(SKEY)||LS.get(SKEY),u=id&&users.find(x=>String(x.id)==id&&x.on);if(u){cu=u;$('#app').hidden=false;document.body.classList.add('in');drawTop();$('#ft').textContent=cfg.name+' — نسخة تجريبية (البيانات محفوظة في هذا المتصفح)';S.pg='';go(can('home')?'home':M.find(p=>can(p[0]))[0]);bump()}else drawLogin()})();
</script>
