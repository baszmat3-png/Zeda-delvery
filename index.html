function nextNo(rows){return Math.max(...O.map(o=>o.no),...(rows||[]).map(r=>+r.no||0))+1}
function bars(no){const l=[];let x=0;String(no).split('').forEach(ch=>{const d=+ch,w=[1+d%3,1,1+((d>>1)%2)+1,1];w.forEach((v,i)=>{if(i%2==0)l.push([x,v]);x+=v});x+=1});return{l,w:x}}
function rcHTML(o){const b=bars(o.no);return `<div class="rcp"><div class="c h">شركة الأفق للتوصيل</div><div class="c">وصل تسليم</div><svg viewBox="0 0 ${b.w} 10" preserveAspectRatio="none">${b.l.map(([x,w])=>`<rect x="${x}" y="0" width="${w}" height="10" fill="#000"/>`).join('')}</svg><div class="c h">${o.no}</div><hr>${[['التاريخ',o.dt],['العميل',o.cl],['الزبون',o.cu],['الهاتف',o.ph],['العنوان',o.pv+' - '+o.ar],['البضاعة',o.gd+' ('+o.qt+')'],['المندوب',o.dr]].map(x=>`<div class="rl"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}<hr><div class="c">المبلغ المطلوب</div><div class="tot">${f(o.am)} د.ع</div><hr><div class="c">شكرًا لتعاملكم معنا</div></div>`}
function rcM(ns,auto){S.rn=ns;const L=ns.map(n=>O.find(o=>o.no==n)).filter(Boolean);if(!L.length)return;modal(`<h3 class="noprint" style="margin:0 0 10px;text-align:center">معاينة الوصل · 58mm</h3><div class="rcw">${L.map(rcHTML).join('')}</div><div class="noprint" style="text-align:center"><button class="btn" onclick="prt()">${ic('print')} طباعة</button><button class="btn g" onclick="dlRc('png')">تحميل PNG</button><button class="btn g" onclick="dlRc('pdf')">تحميل PDF</button></div>`);if(auto)setTimeout(prt,200)}
rc=function(n){rcM([n])};

function rcCanvas(os){const W=464,H=680,c=document.createElement('canvas');c.width=W;c.height=H*os.length;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,c.height);x.fillStyle='#000';x.strokeStyle='#000';x.direction='rtl';
os.forEach((o,k)=>{let y=k*H+44;const R=W-24,L=24,fn=(sz,b)=>x.font=`${b?'700 ':''}${sz}px Cairo,Tahoma,sans-serif`;
const C=(t,sz,b)=>{fn(sz,b);x.textAlign='center';x.fillText(t,W/2,y)},ln=()=>{x.setLineDash([6,4]);x.beginPath();x.moveTo(L,y);x.lineTo(R,y);x.stroke();y+=26};
C('شركة الأفق للتوصيل',30,1);y+=34;C('وصل تسليم',20);y+=22;const b=bars(o.no),sc=(W-48)/b.w;b.l.forEach(([bx,bw])=>x.fillRect(L+bx*sc,y,bw*sc,70));y+=102;C(String(o.no),32,1);y+=16;ln();
[['التاريخ',o.dt],['العميل',o.cl],['الزبون',o.cu],['الهاتف',o.ph],['العنوان',o.pv+' - '+o.ar],['البضاعة',o.gd+' ('+o.qt+')'],['المندوب',o.dr]].forEach(([a,v])=>{fn(20);x.textAlign='right';x.fillText(a,R,y);const lw=x.measureText(a).width;fn(20,1);x.textAlign='left';x.fillText(String(v),L,y,W-48-lw-12);y+=36});
y-=6;ln();C('المبلغ المطلوب',20);y+=40;C(f(o.am)+' د.ع',34,1);y+=22;ln();C('شكرًا لتعاملكم معنا',20)});return c}
function pdfFrom(b64,w,h,pw,ph){const jb=Uint8Array.from(atob(b64),c=>c.charCodeAt(0)),enc=new TextEncoder(),parts=[],xr=[];let off=0;const add=b=>{if(typeof b=='string')b=enc.encode(b);parts.push(b);off+=b.length},obj=(n,body)=>{xr[n]=off;add(n+' 0 obj\n'+body+'\nendobj\n')};
add('%PDF-1.4\n');obj(1,'<</Type/Catalog/Pages 2 0 R>>');obj(2,'<</Type/Pages/Kids[3 0 R]/Count 1>>');obj(3,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${pw} ${ph}]/Resources<</XObject<</Im 4 0 R>>>>/Contents 5 0 R>>`);
xr[4]=off;add(`4 0 obj\n<</Type/XObject/Subtype/Image/Width ${w}/Height ${h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jb.length}>>\nstream\n`);add(jb);add('\nendstream\nendobj\n');
const cs=`q ${pw} 0 0 ${ph} 0 0 cm /Im Do Q`;obj(5,`<</Length ${cs.length}>>\nstream\n${cs}\nendstream`);const xo=off;
add('xref\n0 6\n0000000000 65535 f \n'+[1,2,3,4,5].map(n=>String(xr[n]).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n${xo}\n%%EOF`);return new Blob(parts,{type:'application/pdf'})}
async function dlRc(fmt){const os=S.rn.map(n=>O.find(o=>o.no==n)).filter(Boolean);if(document.fonts&&document.fonts.ready)await document.fonts.ready;const c=rcCanvas(os),nm='receipt-'+(os.length>1?os[0].no+'-'+os[os.length-1].no:os[0].no),a=document.createElement('a');
if(fmt=='png'){a.href=c.toDataURL('image/png');a.download=nm+'.png'}else{const pw=164.4;a.href=URL.createObjectURL(pdfFrom(c.toDataURL('image/jpeg',.95).split(',')[1],c.width,c.height,pw,+(pw*c.height/c.width).toFixed(1)));a.download=nm+'.pdf'}
document.body.appendChild(a);a.click();a.remove();toast('تم التحميل')}
