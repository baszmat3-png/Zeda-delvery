<script>(function(){

function seedDemo(){
 const mk=(username,name,role,extra={})=>{const u={id:++db.seq,username,pass:hash(username+'123'),name,role,phone:'07'+(701000000+db.seq*7919%99999999),...extra};db.users.push(u);return u};
 const rep=db.users.find(u=>u.role==='rep'),ds=[db.users.find(u=>u.id===3),mk('driver2','كرار','driver',{repId:rep.id}),mk('driver3','مصطفى','driver',{repId:rep.id}),mk('driver4','يوسف','driver',{repId:rep.id})];

 const SS=['delivered','delivered','progress','pending','delivered','postponed','rejected','arrived','delivered','progress'],GO=['حاسبة','ملابس','أدوية','إكسسوارات','أجهزة منزلية','هاتف','عطور'];

 [[cs[0],25000],[cs[1],40000],[cs[2],15000],[ds[1],10000],[ds[2],7500]].forEach(([u,a],i)=>db.vouchers.push({id:++db.seq,userId:u.id,amount:a,note:'سند تجريبي '+(i+1),date:now(),archived:false}));
 [2,1,4,4].forEach((id,i)=>notify(id,['وصل جديد بانتظار التأكيد','تم تسليم الوصل 100','تم تحديث حالة وصل','سند جديد بمبلغ 25000'][i]));
 db.seeded=1;save()}
const pr=u=>u;
const ST={pending:'غير مؤكد',progress:'قيد التنفيذ',delivered:'تم التسليم',postponed:'مؤجل',rejected:'رفض',arrived:'واصل'};
const now=()=>new Date().toLocaleString('en-GB',{hour12:false}).replace(',','');
const sign=u=>'tok'+u.id;
function auth(req){const t=(req.headers.authorization||'').slice(7);return t.startsWith('tok')?db.users.find(u=>u.id===+t.slice(3)):undefined}
const pub=u=>{const{pass,...r}=u;return r};

if(!db.seeded)seedDemo();
function visible(u){const r=db.receipts;
 if(u.role==='admin'||u.role==='rep')return r;
 if(u.role==='client')return r.filter(x=>x.clientId===u.id);
 return r.filter(x=>x.driverId===u.id)}
function sum(list,vs){const d=list.filter(x=>x.status==='delivered'),t=d.reduce((a,x)=>a+x.total,0),f=d.reduce((a,x)=>a+x.fee,0),v=vs.reduce((a,x)=>a+x.amount,0);
 return{count:list.length,total:t,fee:f,net:t-f,vouchers:v,final:t-f-v}}
const routes=[];const R=(m,p,fn)=>routes.push([m,new RegExp('^'+p+'$'),fn]);
R('POST','/api/login',(q,b)=>{const u=db.users.find(x=>x.username===b.username);if(!u||!check(b.password||'',u.pass))throw[401,'اسم المستخدم أو كلمة المرور غير صحيحة'];return{token:sign(u),user:pub(u),company:db.company}});
R('POST','/api/track',(q,b)=>{const r=db.receipts.find(x=>String(x.no)===String(b.no).trim()&&x.phone===String(b.phone).trim());if(!r)throw[404,'لا يوجد وصل بهذه المعلومات'];
 const d=db.users.find(u=>u.id===r.driverId);return{no:r.no,status:r.status,gov:r.gov,area:r.area,updated:r.updated,driver:d&&d.name}});

R('POST','/api/demo',(q,b)=>{if(process.env.DEMO==='0')throw[403,'الدخول التجريبي معطل'];const u=db.users.find(x=>x.username===({admin:'admin',rep:'rep',driver:'driver',client:'client'})[b.role]);if(!u)throw[404,'غير موجود'];return{token:sign(u),user:pub(u),company:db.company}});
R('GET','/api/stats',(q,b,u)=>{if(u.role!=='admin')throw[403,'غير مسموح'];const r=db.receipts,by={},gv={},days={},cl={},dv={};
 r.forEach(x=>{by[x.status]=(by[x.status]||0)+1;gv[x.gov]=(gv[x.gov]||0)+1;days[x.date]=(days[x.date]||0)+1;
  if(x.status==='delivered'){const c=db.users.find(y=>y.id===x.clientId);if(c)cl[c.name]=(cl[c.name]||0)+x.total;const d=db.users.find(y=>y.id===x.driverId);if(d)dv[d.name]=(dv[d.name]||0)+1}});
 const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,5);const last7=[...Array(7)].map((_,i)=>{const k=new Date(Date.now()-(6-i)*864e5).toISOString().slice(0,10).replace(/-/g,'/');return[k.slice(5),days[k]||0]});
 return{...sum(r,db.vouchers),orders:r.length,users:db.users.length,clients:db.users.filter(x=>x.role==='client').length,drivers:db.users.filter(x=>x.role==='driver').length,by,gov:top(gv),days:last7,clients_top:top(cl),drivers_top:top(dv),unconfirmed:by.pending||0}});
R('PUT','/api/users/(\\d+)',(q,b,u)=>{if(u.role!=='admin')throw[403,'غير مسموح'];const x=db.users.find(y=>y.id==q[1]);if(!x)throw[404,'غير موجود'];
 if(b.name)x.name=b.name;if(b.phone!==undefined)x.phone=b.phone;if(b.role&&q[1]!=u.id)x.role=b.role;if(b.password)x.pass=hash(b.password);save();return pub(x)});
R('DELETE','/api/receipts/(\\d+)',(q,b,u)=>{if(u.role!=='admin')throw[403,'غير مسموح'];db.receipts=db.receipts.filter(x=>x.id!=q[1]);save();return{ok:1}});
R('PUT','/api/receipts/(\\d+)',(q,b,u)=>{if(u.role!=='admin')throw[403,'غير مسموح'];const r=db.receipts.find(x=>x.id==q[1]);if(!r)throw[404,'غير موجود'];
 for(const k of['name','phone','goods','gov','area','notes'])if(b[k]!==undefined)r[k]=b[k];for(const k of['total','fee','qty'])if(b[k]!==undefined)r[k]=+b[k];r.updated=now();save();return r});
R('DELETE','/api/vouchers/(\\d+)',(q,b,u)=>{if(u.role!=='admin')throw[403,'غير مسموح'];db.vouchers=db.vouchers.filter(x=>x.id!=q[1]);save();return{ok:1}});
R('GET','/api/company',()=>db.company);
R('GET','/api/summary',(q,b,u)=>{const L=visible(u),vs=db.vouchers.filter(v=>u.role==='admin'||v.userId===u.id);
 return{current:sum(L.filter(x=>!x.archived),vs.filter(v=>!v.archived)),all:sum(L,vs)}});
R('GET','/api/receipts',(q,b,u,url)=>{const s=url.searchParams.get('status'),a=url.searchParams.get('archived')==='1',k=url.searchParams.get('q');
 return visible(u).filter(x=>(s?x.status===s:true)&&x.archived===a&&(!k||[x.no,x.name,x.phone,x.gov].join(' ').includes(k))).reverse()});
R('GET','/api/receipts/(\\d+)',(q,b,u)=>{const r=visible(u).find(x=>x.id==q[1]);if(!r)throw[404,'غير موجود'];

R('POST','/api/receipts',(q,b,u)=>{if(!['client','admin'].includes(u.role))throw[403,'غير مسموح'];

 if(db.receipts.some(x=>x.no==b.no&&x.clientId===clientId))throw[400,'رقم الوصل مكرر'];
 const r={id:++db.seq,no:String(b.no),date:new Date().toISOString().slice(0,10).replace(/-/g,'/'),clientId,name:b.name,phone:b.phone,goods:b.goods,qty:+b.qty||1,gov:b.gov,area:b.area||'',total:+b.total,fee:+b.fee||0,notes:b.notes||'',status:'pending',driverId:null,archived:false,updated:now(),log:[]};
 db.receipts.push(r);db.users.filter(x=>x.role==='admin'||x.role==='rep').forEach(x=>notify(x.id,'وصل جديد رقم '+r.no+' بانتظار التأكيد'));save();return r});
R('POST','/api/receipts/(\\d+)/status',(q,b,u)=>{if(u.role==='client')throw[403,'غير مسموح'];const r=visible(u).find(x=>x.id==q[1]);if(!r||!ST[b.status])throw[404,'غير موجود'];
 if(b.driverId)r.driverId=+b.driverId;r.status=b.status;if(b.notes)r.notes=b.notes;r.updated=now();r.log.push({by:u.name,s:b.status,t:r.updated});

R('POST','/api/receipts/(\\d+)/archive',(q,b,u)=>{const r=visible(u).find(x=>x.id==q[1]);if(!r||u.role==='client')throw[403,'غير مسموح'];r.archived=true;save();return r});
R('GET','/api/users',(q,b,u)=>{if(u.role==='client'||u.role==='driver')throw[403,'غير مسموح'];return db.users.filter(x=>u.role==='admin'||x.repId===u.id).map(pub)});
R('POST','/api/users',(q,b,u)=>{if(!['admin','rep'].includes(u.role))throw[403,'غير مسموح'];

 const role=u.role==='rep'?'driver':(['rep','driver','client','admin'].includes(b.role)?b.role:'client');
 const n={id:++db.seq,username:b.username,pass:hash(b.password),name:b.name,role,phone:b.phone||'',repId:u.role==='rep'?u.id:+b.repId||undefined};db.users.push(n);save();return pub(n)});

window.fetch=async(u,o={})=>{const url=new URL(u,'http://x');let b={};try{b=o.body?JSON.parse(o.body):{}}catch(e){}
 const req={headers:{authorization:(o.headers||{}).Authorization||''}};
 const out=(c,j)=>({ok:c<400,status:c,json:async()=>j});
 try{for(const[m,re,fn]of routes){const q=re.exec(url.pathname);if(m===(o.method||'GET')&&q){
  const open=['/api/login','/api/track','/api/company','/api/demo'].includes(url.pathname)&&!(m==='POST'&&url.pathname==='/api/company');
  const us=auth(req);if(!open&&!us)return out(401,{error:'سجّل الدخول'});return out(200,fn(q,b,us,url))}}
  return out(404,{error:'غير موجود'})}catch(e){return Array.isArray(e)?out(e[0],{error:e[1]}):out(500,{error:'خطأ'})}};
})();

function menu(){const r=S.user.role,M=[['','🏠','الرئيسية'],['notes','🔔','الإشعارات'],['search','🔍','البحث']];
 if(r==='client'||r==='admin')M.push(['add','➕','اضافة وصل']);if(r==='client')M.push(['pending','📄','غير مؤكد']);
 if(r==='admin')M.splice(1,0,['orders','📦','كل الوصولات'],['vouchers','💲','السندات']);M.push(['list','📑','الوصولات'],['archive','🗄️','الارشيف']);if(r==='rep'||r==='driver')M.push(['vouchers','💲','السندات']);
 if(r==='admin'||r==='rep')M.push(['users','🚗',r==='rep'?'السواق':'المستخدمون']);M.push(['settings','⚙️','الاعدادات'],['about','ℹ️','حول']);return M}
function shell(title,body,back){return `<div class="top"><button class="m ${back?'bk':''}" onclick="${back?'history.back()':'$(\'.drawer\').classList.add(\'open\')'}">${back?'‹':'☰'}</button>${title}</div>${body}
<div class="drawer" onclick="if(event.target.tagName!=='DIV'||event.target.className.includes('drawer'))this.classList.remove('open')"><div class="prof"><div class="logo">${S.co.en}</div><div>${S.user.name}<br>${ROLE[S.user.role]}</div></div>
${menu().map(m=>`<a onclick="go('${m[0]}')"><span>${m[1]}</span>${m[2]}</a>`).join('')}<a onclick="out()"><span>🚪</span>تسجيل خروج</a></div>`}
const rows=(c,items)=>items.map(([l,v,bg,ic])=>`<div class="row"><i style="background:${bg}">${ic}</i><div><b>${l}</b><span>${v}</span></div></div>`).join('');
function acct(t,a,cl){const I=[['المبلغ الكلي',n(a.total),'#eef','💵'],['اجرة التوصيل',n(a.fee),'#fee','⇄'],['المبلغ الصافي',n(a.net),'#efe','🏛️']];
 if(!cl)I.push(['السندات',n(a.vouchers),'#efe','💳'],['المبلغ النهائي',n(a.final),'#efe','💰']);
 return `<div class="card ${t==='الحساب الكلي'?'dk':''}"><div class="c"><h3>${t}</h3>عدد الوصولات : ${a.count}</div>${rows(0,I)}</div>`}
function card(r){return `<div class="rc s-${r.status}"><div>رقم الوصل : ${r.no}</div><div>هاتف المستلم : ${r.phone}</div><div>المحافظة : ${r.gov}</div><div>المنطقة : ${r.area||''}</div><div>المبلغ الكلي : ${n(r.total)}</div><div>اخر تحديث : ${r.updated}</div><div class="tag">${ST[r.status]}</div><button class="btn s" style="width:70%;display:block;margin:8px auto" onclick="go('r/${r.id}')">عرض التفاصيل</button></div>`}
const bars=(a,f=n)=>{const m=Math.max(1,...a.map(x=>x[1]));return a.map(x=>`<div class="bar"><span>${x[0]}</span><i style="width:${x[1]/m*55}%"></i>${f(x[1])}</div>`).join('')};
const V={
async '' (){if(S.user.role==='admin')return dash();const s=await api('summary'),c=S.user.role==='client';return shell('الرئيسية',(c?`<div class="pad" style="display:flex;gap:10px;margin-top:14px"><button class="btn s" style="flex:1" onclick="go('statement')">كشف حساب</button><button class="btn s" style="flex:1" onclick="go('returns')">كشف مرتجعات</button></div>`:'')+acct('الحساب الحالي',s.current,c)+acct('الحساب الكلي',s.all,c))},
async list(){const q=new URLSearchParams(location.hash.split('?')[1]||'');const st=q.get('s')||'progress',l=await api('receipts?status='+st);
 return shell('الوصولات',`<div class="tabs">${Object.keys(ST).filter(k=>k!=='pending').map(k=>`<button class="${k===st?'on':''}" onclick="go('list?s=${k}')">${ST[k]}</button>`).join('')}</div>`+(l.length?l.map(card).join(''):'<div class="empty">لا توجد وصولات</div>'))},
async pending(){const l=await api('receipts?status=pending');return shell('غير مؤكد',l.length?l.map(card).join(''):'<div class="empty">لا توجد وصولات</div>')},
async archive(){const l=await api('receipts?archived=1');return shell('الارشيف',l.length?l.map(card).join(''):'<div class="empty">الارشيف فارغ</div>')},
async search(){return shell('البحث',`<div class="box" style="margin-top:20px"><input id="q" placeholder="رقم الوصل أو الهاتف أو الاسم"></div><button class="btn" onclick="doSearch()">بحث</button><div id="res"></div>`)},
async add(){return shell('اضافة وصل',`<div class="box" style="margin:16px">${[['no','رقم الوصل'],['name','اسم الزبون'],['phone','هاتف الزبون'],['area','المنطقة'],['goods','نوع البضاعة'],['qty','عدد القطع','number'],['total','المبلغ الكلي','number'],['fee','اجرة التوصيل','number']].map(f=>`<input id="f_${f[0]}" type="${f[2]||'text'}" placeholder="${f[1]}">`).join('').replace('<input id="f_area"',`<select id="f_gov">${GOVS.map(g=>`<option>${g}</option>`).join('')}</select><input id="f_area"`)}<textarea id="f_notes" placeholder="الملاحظات"></textarea></div><div class="err" id="e"></div><button class="btn" onclick="addR()">حفظ الوصل</button>`)},
async 'r'(id){const r=await api('receipts/'+id),u=S.user,can=u.role!=='client';let dr=[];if(can&&u.role!=='driver')try{dr=(await api('users')).filter(x=>x.role==='driver')}catch{}
 return shell(r.no,`<div class="info"><h4>معلومات الوصل</h4>${[['رقم الوصل',r.no],['تاريخ الاضافة',r.date],['اسم المستلم',r.name],['هاتف المستلم',r.phone],['نوع البضاعة',r.goods],['عدد القطع',r.qty],['المحافظة',r.gov],['المنطقة',r.area||''],['المبلغ الكلي',n(r.total)],['اجرة التوصيل',n(r.fee)],['المبلغ الصافي',n(r.total-r.fee)],['الملاحظات',r.notes||''],['الحالة',ST[r.status]],['اخر تحديث',r.updated]].map(x=>`<p>${x[0]} : <em>${x[1]}</em></p>`).join('')}<h4>معلومات السائق</h4><p>اسم السائق : <em>${r.driver?r.driver.name:'—'}</em></p><p>هاتف السائق : <em>${r.driver?r.driver.phone:'—'}</em></p></div>`+
 (can?`<div class="box" style="margin:14px">${dr.length?`<select id="dr"><option value="">اختر السائق</option>${dr.map(d=>`<option value="${d.id}" ${d.id===r.driverId?'selected':''}>${d.name}</option>`).join('')}</select>`:''}<select id="ns">${Object.keys(ST).map(k=>`<option value="${k}" ${k===r.status?'selected':''}>${ST[k]}</option>`).join('')}</select><input id="nn" placeholder="ملاحظة"></div><button class="btn" onclick="setS(${r.id})">تحديث الحالة</button>${['delivered','rejected'].includes(r.status)&&!r.archived?`<button class="btn" onclick="arch(${r.id})">نقل للأرشيف</button>`:''}`:''),1)},
async notes(){const l=await api('notifications');return shell('الإشعارات',l.length?l.map(x=>`<div class="info" style="padding:8px 18px">${x.text}<br><small style="color:#888">${x.date}</small></div>`).join(''):'<div class="empty">لا توجد إشعارات</div>')},
async vouchers(){const l=await api('vouchers'),us=S.user.role==='admin'?await api('users'):[];return shell('السندات',(S.user.role==='admin'?`<div class="box" style="margin:14px"><select id="vu">${us.filter(u=>u.role!=='admin').map(u=>`<option value="${u.id}">${u.name} (${ROLE[u.role]})</option>`)}</select><input id="va" type="number" placeholder="المبلغ"><input id="vn" placeholder="ملاحظة"></div><button class="btn" onclick="addV()">اضافة سند</button>`:'')+(l.length?`<div class="tw"><table><tr><th>التاريخ</th><th>المبلغ</th><th>ملاحظة</th>${S.user.role==='admin'?'<th>المستخدم</th><th></th>':''}</tr>${l.map(v=>`<tr><td>${v.date}</td><td>${n(v.amount)}</td><td>${v.note}</td>${S.user.role==='admin'?`<td>${(us.find(u=>u.id===v.userId)||{}).name||''}</td><td><a onclick="delV(${v.id})" style="color:red;cursor:pointer">حذف</a></td>`:''}</tr>`).join('')}</table></div>`:'<div class="empty">لا توجد سندات</div>'))},
async users(){const l=await api('users'),a=S.user.role==='admin';return shell(a?'المستخدمون':'السواق',`<div class="box" style="margin:14px"><input id="un" placeholder="الاسم"><input id="uu" placeholder="اسم المستخدم"><input id="up" placeholder="كلمة المرور"><input id="uh" placeholder="الهاتف">${a?`<select id="ur">${Object.entries(ROLE).map(([k,v])=>`<option value="${k}">${v}</option>`)}</select>`:''}</div><div class="err" id="e"></div><button class="btn" onclick="addU()">اضافة</button><div class="tw"><table><tr><th>الاسم</th><th>المستخدم</th><th>الدور</th>${a?'<th></th>':''}</tr>${l.map(u=>`<tr><td>${u.name}</td><td>${u.username}</td><td>${ROLE[u.role]}</td>${a?`<td style="white-space:nowrap"><a onclick="editU(${u.id},'${u.name}')" style="cursor:pointer">تعديل</a> | <a onclick="delU(${u.id})" style="color:red;cursor:pointer">حذف</a></td>`:''}</tr>`).join('')}</table></div>`)},
async settings(){return shell('الاعدادات',`<div class="box" style="margin:14px"><input id="po" type="password" placeholder="كلمة المرور الحالية"><input id="pn" type="password" placeholder="كلمة المرور الجديدة"></div><div class="err" id="e"></div><button class="btn" onclick="chPw()">تغيير كلمة المرور</button>`+(S.user.role==='admin'?`<div class="box" style="margin:14px"><input id="cn" value="${S.co.name}" placeholder="اسم الشركة"><input id="ce" value="${S.co.en}" placeholder="Company name"></div><button class="btn" onclick="saveCo()">حفظ بيانات الشركة</button>`:''))},
async about(){return shell('حول',`<div class="info"><h4>${S.co.name}</h4><p style="text-align:center">${S.co.en}</p><p style="text-align:center">نظام ادارة الوصولات والتوصيل — الإصدار 1.0</p></div>`)},
async statement(){const l=(await api('receipts?status=delivered')).concat(await api('receipts?archived=1').then(a=>a.filter(x=>x.status==='delivered')));return shell('كشف حساب',tbl(l),1)},
async returns(){const l=await api('receipts?status=rejected');return shell('كشف مرتجعات',tbl(l),1)}};
async function dash(){const d=await api('stats');const T=(l,v)=>`<div class="st">${l}<b>${v}</b></div>`;
 return shell('لوحة التحكم',`<div class="g">${T('الوصولات',d.orders)}${T('بانتظار التأكيد',d.unconfirmed)}${T('اجمالي المبالغ المسلمة',n(d.total))}${T('اجور التوصيل',n(d.fee))}${T('الصافي',n(d.net))}${T('السندات',n(d.vouchers))}${T('العملاء',d.clients)}${T('السواق',d.drivers)}</div>
 <div class="card"><h3>الوصولات خلال 7 أيام</h3><div class="col">${d.days.map(x=>`<div><i style="height:${x[1]*22}px"></i>${x[0]}<br>${x[1]}</div>`).join('')}</div></div>
 <div class="card"><h3>حسب الحالة</h3>${bars(Object.entries(d.by).map(([k,v])=>[ST[k],v]))}</div>
 <div class="card"><h3>أكثر المحافظات</h3>${bars(d.gov)}</div><div class="card"><h3>أفضل العملاء (مبالغ مسلمة)</h3>${bars(d.clients_top)}</div><div class="card"><h3>أفضل السواق (تسليمات)</h3>${bars(d.drivers_top)}</div>
 <button class="btn" onclick="go('orders')">ادارة الوصولات</button>`)}
V.orders=async()=>{const q=new URLSearchParams(location.hash.split('?')[1]||''),st=q.get('s')||'',k=q.get('q')||'';const l=await api('receipts?'+(st?'status='+st+'&':'')+'q='+encodeURIComponent(k));
 return shell('كل الوصولات',`<div class="pad" style="margin-top:12px"><select class="sel" onchange="go('orders?s='+this.value)"><option value="">كل الحالات</option>${Object.keys(ST).map(x=>`<option value="${x}" ${x===st?'selected':''}>${ST[x]}</option>`)}</select><input class="sel" id="oq" value="${k}" placeholder="بحث" onchange="go('orders?s=${st}&q='+this.value)"><button class="btn s" onclick="go('add')">+ وصل</button></div>
 <div class="tw"><table><tr><th>الوصل</th><th>الزبون</th><th>المحافظة</th><th>المبلغ</th><th>الحالة</th><th></th></tr>${l.map(r=>`<tr><td>${r.no}</td><td>${r.name}</td><td>${r.gov}</td><td>${n(r.total)}</td><td>${ST[r.status]}</td><td style="white-space:nowrap"><a onclick="go('r/${r.id}')" style="cursor:pointer">عرض</a> | <a onclick="editR(${r.id},${r.total},${r.fee})" style="cursor:pointer">تعديل</a> | <a onclick="delR(${r.id})" style="color:red;cursor:pointer">حذف</a></td></tr>`).join('')}</table></div>${l.length?'':'<div class="empty" style="margin-top:10vh">لا توجد نتائج</div>'}`)};
window.delR=wrap(async id=>{if(confirm('حذف الوصل نهائيا؟')){await api('receipts/'+id,'DELETE');render()}});
window.editR=wrap(async(id,t,f)=>{const a=prompt('المبلغ الكلي',t);if(a===null)return;const b=prompt('اجرة التوصيل',f);if(b===null)return;await api('receipts/'+id,'PUT',{total:a,fee:b});render()});
window.editU=wrap(async(id,nm)=>{const a=prompt('الاسم',nm);if(a===null)return;const p=prompt('كلمة مرور جديدة (اتركها فارغة بدون تغيير)');await api('users/'+id,'PUT',{name:a,password:p||undefined});render()});
window.delV=wrap(async id=>{if(confirm('حذف السند؟')){await api('vouchers/'+id,'DELETE');render()}});
window.demo=wrap(async r=>{const x=await api('demo','POST',{role:r});S.tok=localStorage.t=x.token;S.user=x.user;localStorage.u=JSON.stringify(x.user);S.co=x.company;go('')});
const tbl=l=>l.length?`<div class="tw"><table><tr><th>الوصل</th><th>التاريخ</th><th>المبلغ</th><th>الأجرة</th><th>الصافي</th></tr>${l.map(r=>`<tr><td>${r.no}</td><td>${r.date}</td><td>${n(r.total)}</td><td>${n(r.fee)}</td><td>${n(r.total-r.fee)}</td></tr>`).join('')}<tr><th>المجموع</th><th></th><th>${n(l.reduce((a,r)=>a+r.total,0))}</th><th>${n(l.reduce((a,r)=>a+r.fee,0))}</th><th>${n(l.reduce((a,r)=>a+r.total-r.fee,0))}</th></tr></table></div>`:'<div class="empty">لا توجد بيانات</div>';
const g=i=>$('#'+i).value,E=m=>$('#e').textContent=m;
function wrap(f){return async(...a)=>{try{await f(...a)}catch(e){$('#e')?E(e):alert(e)}}}
window.doSearch=wrap(async()=>{const l=await api('receipts?q='+encodeURIComponent(g('q')));$('#res').innerHTML=l.length?l.map(card).join(''):'<div class="empty" style="margin-top:60px">لا توجد نتائج</div>'});
window.addR=wrap(async()=>{const b={};['no','name','phone','gov','area','goods','qty','total','fee','notes'].forEach(k=>b[k]=g('f_'+k));await api('receipts','POST',b);alert('تمت اضافة الوصل');go('pending'.replace('pending',S.user.role==='client'?'pending':'list'))});
window.setS=wrap(async id=>{await api(`receipts/${id}/status`,'POST',{status:g('ns'),driverId:$('#dr')?g('dr'):'',notes:g('nn')});render()});
window.arch=wrap(async id=>{await api(`receipts/${id}/archive`,'POST');go('archive')});
window.addV=wrap(async()=>{await api('vouchers','POST',{userId:g('vu'),amount:g('va'),note:g('vn')});render()});
window.addU=wrap(async()=>{await api('users','POST',{name:g('un'),username:g('uu'),password:g('up'),phone:g('uh'),role:$('#ur')?g('ur'):'driver'});render()});
window.delU=wrap(async id=>{if(confirm('حذف المستخدم؟')){await api('users/'+id,'DELETE');render()}});
window.chPw=wrap(async()=>{await api('password','POST',{old:g('po'),pass:g('pn')});alert('تم التغيير')});
window.saveCo=wrap(async()=>{S.co=await api('company','POST',{name:g('cn'),en:g('ce')});alert('تم الحفظ')});
function loginView(){document.body.className=S.tab==='client'?'client':'';return `<div class="logo">${S.co.en}</div><div class="seg"><button class="${S.tab==='client'?'on':''}" onclick="S.tab='client';render()">زبون</button><button class="${S.tab==='user'?'on':''}" onclick="S.tab='user';render()">مستخدم</button></div>
<div class="box">${S.tab==='user'?`<input id="lu" placeholder="اسم المستخدم" autocomplete="username"><input id="lp" type="password" placeholder="كلمة المرور" autocomplete="current-password">`:`<input id="tp" placeholder="رقم الهاتف" inputmode="tel"><input id="tn" placeholder="رقم الوصل">`}</div><div class="err" id="e"></div>
<button class="btn" onclick="${S.tab==='user'?'login()':'track()'}">${S.tab==='user'?'تسجيل دخول':'بحث'}</button><div id="res"></div><div class="demo"><small>دخول تجريبي سريع</small>${[['admin','المدير'],['rep','المندوب'],['driver','السائق'],['client','العميل']].map(x=>`<button onclick="demo('${x[0]}')">${x[1]}</button>`).join('')}</div>${S.tab==='user'?'<button class="btn s" style="display:block;margin:auto;background:#fff2" onclick="go(\'about\')">حول</button>':''}`}
window.login=wrap(async()=>{const r=await api('login','POST',{username:g('lu'),password:g('lp')});S.tok=localStorage.t=r.token;S.user=r.user;localStorage.u=JSON.stringify(r.user);S.co=r.company;go('')});
window.track=wrap(async()=>{const r=await api('track','POST',{phone:g('tp'),no:g('tn')});$('#res').innerHTML=`<div class="rc s-${r.status}"><div>رقم الوصل : ${r.no}</div><div>الحالة : <b>${ST[r.status]}</b></div><div>المحافظة : ${r.gov}</div><div>السائق : ${r.driver||'—'}</div><div>اخر تحديث : ${r.updated}</div></div>`});
async function render(){const h=location.hash.slice(1).split('?')[0];
 if(!S.user){$('#app').innerHTML=loginView();return}
 document.body.className=S.user.role==='client'?'client':'';
 try{const[p,a]=h.split('/');if(!V[p])throw'';$('#app').innerHTML=await V[p](a)}catch(e){$('#app').innerHTML=shell('خطأ','<div class="empty">'+(e||'الصفحة غير موجودة')+'</div>')}}
window.onhashchange=render;fetch('/api/company').then(r=>r.json()).then(c=>{S.co=c;if(!S.user)render()});render();
</script></body></html>
